<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>生日快乐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
/*柔光渐变背景*/
body{
background:#fdf6f8;font-family:微软雅黑;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
animation:bgChange 8s infinite alternate;
}
@keyframes bgChange{
0%{background:#fdf6f8}
50%{background:#fff0f6}
100%{background:#fff5ee}
}
.btn{padding:12px 26px;background:#ff5e87;color:#fff;border:0;border-radius:8px;font-size:17px;cursor:pointer}
.cakeBox{width:360px;height:340px;perspective:1200px;display:none}
.cake3d{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:cakeShow 1s ease-out}
@keyframes cakeShow{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
/*发光标题*/
.cakeTit{
position:absolute;top:-38px;width:100%;text-align:center;font-size:22px;color:#ff5e87;font-weight:bold;
animation:textLight 2.5s infinite alternate;
}
@keyframes textLight{
0%{text-shadow:0 0 6px #ff88aa,0 0 10px #ffc0cb;}
100%{text-shadow:0 0 12px #ff6699,0 0 20px #ffb6c1;}
}
.plate{width:330px;height:16px;background:#fff;border-radius:50%;position:absolute;bottom:10px;left:15px;box-shadow:0 4px 8px #ddd}
.cakeLow{width:270px;height:92px;background:#f6e8d0;border-radius:14px;position:absolute;bottom:22px;left:45px;box-shadow:inset 0 -6px #e9d9bc}
.cakeUp{width:175px;height:75px;background:#f6e8d0;border-radius:12px;position:absolute;bottom:110px;left:92px;box-shadow:inset 0 -5px #e9d9bc}
.creamWave{position:absolute;height:18px;background:#fff8ef;border-radius:50% 50% 0 0}
.waveLow{width:270px;bottom:20px;left:45px;background:radial-gradient(circle at bottom,#fff8ef 55%,transparent 56%) repeat-x;background-size:32px 18px}
.waveUp{width:175px;bottom:108px;left:92px;background:radial-gradient(circle at bottom,#fff8ef 55%,transparent 56%) repeat-x;background-size:26px 18px}
.dot{border-radius:50%;position:absolute}
.gold{background:#ffd700;box-shadow:0 0 3px #ffd700}
.pearl{background:#fff;box-shadow:0 0 2px #eee}
.g1{width:7px;height:7px;bottom:28px;left:52px}.p1{width:6px;height:6px;bottom:29px;left:78px}
.g2{width:7px;height:7px;bottom:28px;left:110px}.p2{width:6px;height:6px;bottom:29px;left:135px}
.g3{width:7px;height:7px;bottom:28px;left:162px}.p3{width:6px;height:6px;bottom:29px;left:190px}
.g4{width:7px;height:7px;bottom:28px;left:222px}.p4{width:6px;height:6px;bottom:29px;left:246px}
.gu1{width:6px;height:6px;bottom:116px;left:102px}.pu1{width:5px;height:5px;bottom:117px;left:128px}
.gu2{width:6px;height:6px;bottom:116px;left:152px}.pu2{width:5px;height:5px;bottom:117px;left:176px}
.candle{width:9px;height:52px;background:#ffffff;border-radius:4px;position:absolute;bottom:170px;left:155px}
/*火苗+烛光光晕*/
.flame{
width:13px;height:19px;background:#ffdd33;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
position:absolute;bottom:220px;left:153px;animation:fire 0.55s infinite alternate;
box-shadow:0 0 15px #ffdd33,0 0 30px #ffbb22;
}
@keyframes fire{from{transform:scale(0.9)}to{transform:scale(1.15)}}
.topDot{position:absolute;border-radius:50%}
.tgL{width:5px;height:5px;background:#ffd700;bottom:176px;left:130px}
.tpL{width:5px;height:5px;background:#fff;bottom:190px;left:120px}
.tgR{width:5px;height:5px;background:#ffd700;bottom:176px;left:180px}
.tpR{width:5px;height:5px;background:#fff;bottom:190px;left:190px}
.crumb{position:absolute;border-radius:50%}
.cLight{width:9px;height:9px;background:#f8e9cc;bottom:8px}
.cDark{width:6px;height:6px;background:#b8946c;bottom:10px}
.cl1{left:25px}.cd1{left:42px}
.cl2{left:295px}.cd2{left:278px}
.cl3{left:160px}.cd3{left:180px}
.firework{position:fixed;bottom:0;width:8px;height:8px;border-radius:50%;z-index:99}
/*闪烁星光*/
.star{
position:fixed;background:#fff;border-radius:50%;opacity:0.7;
animation:twinkle 2.2s infinite alternate;
}
@keyframes twinkle{0%{opacity:0.2}100%{opacity:1}}
</style>
</head>
<body>
<!--自动生成全屏星光-->
<script>
//生成闪烁星星
for(let s=0;s<35;s++){
  let star=document.createElement('div');
  star.className='star';
  let sz=Math.random()*3+1;
  star.style.width=star.style.height=sz+'px';
  star.style.left=Math.random()*100+'vw';
  star.style.top=Math.random()*100+'vh';
  star.style.animationDelay=Math.random()*2+'s';
  document.body.append(star);
}
</script>
<div class="cakeBox" id="cakeBox">
  <div class="cake3d">
    <div class="cakeTit">祝王雅丽生日快乐</div>
    <div class="plate"></div>
    <div class="cakeLow"></div>
    <div class="waveLow creamWave"></div>
    <div class="cakeUp"></div>
    <div class="waveUp creamWave"></div>
    <div class="dot gold g1"></div><div class="dot pearl p1"></div>
    <div class="dot gold g2"></div><div class="dot pearl p2"></div>
    <div class="dot gold g3"></div><div class="dot pearl p3"></div>
    <div class="dot gold g4"></div><div class="dot pearl p4"></div>
    <div class="dot gold gu1"></div><div class="dot pearl pu1"></div>
    <div class="dot gold gu2"></div><div class="dot pearl pu2"></div>
    <div class="candle"></div>
    <div class="flame"></div>
    <div class="topDot tgL"></div><div class="topDot tpL"></div>
    <div class="topDot tgR"></div><div class="topDot tpR"></div>
    <div class="crumb cLight cl1"></div><div class="crumb cDark cd1"></div>
    <div class="crumb cLight cl2"></div><div class="crumb cDark cd2"></div>
    <div class="crumb cLight cl3"></div><div class="crumb cDark cd3"></div>
  </div>
</div>
<button class="btn" id="giftBtn" onclick="openGift()">🎁神秘礼物</button>
<div style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);align-items:center;justify-content:center" id="pop">
  <div style="background:#fff;padding:30px;border-radius:16px;text-align:center">
    <h2>惊喜礼物送达！</h2>
    <button class="btn" onclick="closePop()" style="margin-top:15px">关闭</button>
  </div>
</div>
<script>
function startFire(){
    const colorArr=['#ff3333','#ffdd00','#33ee55','#33ccff','#ff77dd'];
    for(let i=0;i<80;i++){
        let dom=document.createElement('div');
        dom.className='firework';
        dom.style.left=Math.random()*100+'vw';
        dom.style.background=colorArr[Math.floor(Math.random()*colorArr.length)];
        document.body.appendChild(dom);
        let tx=(Math.random()-0.5)*400;
        let ty=-Math.random()*600-200;
        dom.animate([
            {transform:'translate(0,0)',opacity:1},
            {transform:`translate(${tx}px,${ty}px)`,opacity:0}
        ],{duration:1200,easing:'ease-out'});
        setTimeout(()=>dom.remove(),1200);
    }
}
function openGift(){
  document.getElementById('pop').style.display='flex';
  document.getElementById('cakeBox').style.display='block';
  document.getElementById('giftBtn').style.display='none';
  startFire();
}
function closePop(){
  document.getElementById('pop').style.display='none';
}
</script>
</body>
</html>
