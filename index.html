<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arix Signature Cake</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020202;
            font-family: 'Cinzel', serif;
            color: #ffd4b8;
        }

        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
            text-shadow: 0 0 20px rgba(255, 210, 170, 0.3);
            opacity: 0.8;
        }

        .btn {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 210, 170, 0.3);
            color: #ffd4b8;
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 210, 170, 0.1);
            border-color: #ffd4b8;
            box-shadow: 0 0 20px rgba(255, 210, 170, 0.15);
            transform: translateY(-2px);
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div id="loading">ASSEMBLING DESSERT...</div>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <h1>Arix Signature Cake</h1>
        <button id="toggle-btn" class="btn">Switch State</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        const CONFIG = {
            particleCount: 28000,
            creamParticleCount: 6000,
            ornamentCount: 420,
            flameCount: 1300,

            colors: {
                cream: new THREE.Color('#fff8ee'),
                creamShadow: new THREE.Color('#e6d5be'),
                pink: new THREE.Color('#ffb8c8'),
                pinkDark: new THREE.Color('#ff8fab'),
                gold: new THREE.Color('#FFD700'),
                chocolate: new THREE.Color('#6b3f28'),
                flame: new THREE.Color('#ff7722'),
                flameBright: new THREE.Color('#fff299')
            },

            cake: {
                bottom: { radius: 10.5, height: 5.0 },
                top: { radius: 6.2, height: 3.8 },
                gap: 0.0
            },

            scatterRadius: 42
        };

        const STATE = {
            stage: 0,
            transition: 0,
            time: 0
        };

        let scene, camera, renderer, composer;
        let foliageSystem, creamSystem, ornamentSystem, flameSystem;
        const clock = new THREE.Clock();

        const foliageVertexShader = `
            uniform float uTime;
            uniform float uTransition;
            
            attribute vec3 aScatterPos;
            attribute vec3 aCakePos;
            attribute float aRandom;
            attribute float aSize;
            attribute vec3 aColor;

            varying vec3 vColor;
            varying float vAlpha;

            float cubicInOut(float t) {
                return t < 0.5 ? 4.0 * t * t * t : 1.0 - pow(-2.0 * t + 2.0, 3.0) / 2.0;
            }

            void main() {
                vColor = aColor;
                float t = smoothstep(0.0, 1.0, (uTransition * 1.45) - (aRandom * 0.55));
                t = cubicInOut(clamp(t, 0.0, 1.0));
                vec3 pos = mix(aScatterPos, aCakePos, t);

                float breathe = sin(uTime * 1.6 + aRandom * 12.0) * 0.08;
                pos += normalize(pos + 0.001) * breathe;
                pos.y += sin(uTime * 0.9 + aRandom * 80.0) * 0.035;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = aSize * (420.0 / -mvPosition.z);
            }
        `;

        const foliageFragmentShader = `
            varying vec3 vColor;
            void main() {
                vec2 uv = gl_PointCoord.xy - 0.5;
                if (length(uv) > 0.5) discard;
                float strength = 1.0 - length(uv) * 2.0;
                strength = pow(strength, 1.6);
                gl_FragColor = vec4(vColor, strength * 0.85);
            }
        `;

        const flameVertexShader = `
            uniform float uTime;
            attribute vec3 aOrigin;
            attribute float aRandom;
            attribute float aLife;
            varying vec3 vColor;
            varying float vAlpha;

            void main() {
                float t = mod(uTime * 1.3 + aRandom * 11.0, aLife);
                float progress = t / aLife;

                float flicker = sin(uTime * 9.0 + aRandom * 20.0) * 0.12;
                float flickerY = sin(uTime * 7.0 + aRandom * 15.0) * 0.08;

                vec3 pos = aOrigin;
                pos.y += progress * 3.2 + flickerY;
                pos.x += sin(uTime * 5.5 + aRandom * 18.0) * (1.0 - progress) * 0.35 + flicker;
                pos.z += cos(uTime * 5.5 + aRandom * 18.0) * (1.0 - progress) * 0.35;

                vColor = mix(vec3(1.0, 0.42, 0.12), vec3(1.0, 0.96, 0.62), progress);
                vAlpha = 1.0 - progress;
                float brightness = 0.85 + sin(uTime * 12.0 + aRandom * 30.0) * 0.15;
                vAlpha *= brightness;

                vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                gl_PointSize = (1.0 - progress) * 15.0 * (320.0 / -mvPosition.z);
            }
        `;

        const flameFragmentShader = `
            varying vec3 vColor;
            varying float vAlpha;
            void main() {
                vec2 uv = gl_PointCoord - 0.5;
                float dist = length(uv);
                if (dist > 0.5) discard;
                float glow = pow(1.0 - dist * 2.0, 2.0);
                float core = smoothstep(0.4, 0.05, dist);
                gl_FragColor = vec4(vColor, max(glow * vAlpha, core * 0.95));
            }
        `;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020202, 0.018);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 8, 78);

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.8));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.65;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.28);
            scene.add(ambientLight);
            const spot1 = new THREE.SpotLight(0xffddbb, 110);
            spot1.position.set(22, 48, 22);
            spot1.angle = 0.5;
            spot1.penumbra = 1;
            scene.add(spot1);
            const spot2 = new THREE.SpotLight(0xffffff, 45);
            spot2.position.set(-18, 8, 18);
            scene.add(spot2);
            const rimLight = new THREE.PointLight(0xffccaa, 18, 100);
            rimLight.position.set(0, 18, -18);
            scene.add(rimLight);

            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.8, 0.45, 0.35);
            bloomPass.threshold = 0.35;
            bloomPass.strength = 0.8;
            bloomPass.radius = 0.45;
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createCakeParticles();
            createCreamTopParticles();
            createOrnaments();
            createFlameParticles();

            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            document.getElementById('toggle-btn').addEventListener('click', () => {
                STATE.stage = (STATE.stage + 1) % 3;
                console.log("当前阶段：", STATE.stage);
            });
            animate();
        }

        function createCakeParticles() {
            const geo = new THREE.BufferGeometry();
            const scatterPos = [];
            const cakePos = [];
            const randoms = [];
            const sizes = [];
            const colors = [];
            const colorLerp = new THREE.Color();

            const bottomYMin = -CONFIG.cake.bottom.height / 2;
            const bottomYMax = CONFIG.cake.bottom.height / 2;
            const topYMin = bottomYMax + CONFIG.cake.gap;
            const topYMax = topYMin + CONFIG.cake.top.height;

            for (let i = 0; i < CONFIG.particleCount; i++) {
                const layer = Math.random() < 0.55 ? 'bottom' : 'top';
                let radius, yMin, yMax;
                if (layer === 'bottom') {
                    radius = CONFIG.cake.bottom.radius;
                    yMin = bottomYMin;
                    yMax = bottomYMax;
                } else {
                    radius = CONFIG.cake.top.radius;
                    yMin = topYMin;
                    yMax = topYMax;
                }
                const u = Math.random(), v = Math.random();
                const theta = 2 * Math.PI * u;
                const r = CONFIG.scatterRadius * Math.cbrt(Math.random());
                const sx = r * Math.sin(theta) * Math.cos(Math.acos(2 * v - 1));
                const sy = r * Math.sin(theta) * Math.sin(Math.acos(2 * v - 1));
                const sz = r * Math.cos(Math.acos(2 * v - 1));
                scatterPos.push(sx, sy, sz);

                const cakeAngle = Math.random() * Math.PI * 2;
                const cakeR = Math.sqrt(Math.random()) * radius;
                const cy = yMin + Math.random() * (yMax - yMin);
                cakePos.push(Math.cos(cakeAngle) * cakeR, cy, Math.sin(cakeAngle) * cakeR);

                randoms.push(Math.random());
                sizes.push(Math.random() * 0.38 + 0.26);
                if (Math.random() > 0.972) {
                    colorLerp.set(CONFIG.colors.gold);
                    sizes[sizes.length - 1] *= 2.1;
                } else if (layer === 'bottom') {
                    colorLerp.lerpColors(CONFIG.colors.chocolate, CONFIG.colors.cream, Math.random());
                } else {
                    colorLerp.lerpColors(CONFIG.colors.pink, CONFIG.colors.cream, Math.random());
                }
                colors.push(colorLerp.r, colorLerp.g, colorLerp.b);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatterPos, 3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatterPos, 3));
            geo.setAttribute('aCakePos', new THREE.Float32BufferAttribute(cakePos, 3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms, 1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uTransition: { value: 0 } },
                vertexShader: foliageVertexShader,
                fragmentShader: foliageFragmentShader,
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
            foliageSystem = new THREE.Points(geo, mat);
            scene.add(foliageSystem);
        }

        function createCreamTopParticles() {
            const geo = new THREE.BufferGeometry();
            const scatterPos = [];
            const cakePos = [];
            const randoms = [];
            const sizes = [];
            const colors = [];
            const colorLerp = new THREE.Color();
            const topYMin = CONFIG.cake.bottom.height / 2 + CONFIG.cake.gap;
            const topCenterY = topYMin + CONFIG.cake.top.height * 0.5;

            for (let i = 0; i < CONFIG.creamParticleCount; i++) {
                const u = Math.random(), v = Math.random();
                const theta = 2 * Math.PI * u;
                const r = CONFIG.scatterRadius * Math.cbrt(Math.random());
                const sx = r * Math.sin(theta) * Math.cos(Math.acos(2 * v - 1));
                const sy = r * Math.sin(theta) * Math.sin(Math.acos(2 * v - 1));
                const sz = r * Math.cos(Math.acos(2 * v - 1));
                scatterPos.push(sx, sy, sz);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.sqrt(Math.random()) * CONFIG.cake.top.radius * 0.88;
                const noise = (Math.random() - 0.5) * 0.18;
                cakePos.push(Math.cos(angle) * dist, topCenterY + noise, Math.sin(angle) * dist);

                randoms.push(Math.random());
                sizes.push(Math.random() * 0.34 + 0.30);
                colorLerp.lerpColors(CONFIG.colors.cream, CONFIG.colors.creamShadow, Math.random());
                colors.push(colorLerp.r, colorLerp.g, colorLerp.b);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatterPos, 3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatterPos, 3));
            geo.setAttribute('aCakePos', new THREE.Float32BufferAttribute(cakePos, 3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms, 1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));

            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uTransition: { value: 0 } },
                vertexShader: foliageVertexShader,
                fragmentShader: foliageFragmentShader,
                transparent: true,
                depthWrite: false,
                blending: THREE.NormalBlending
            });
            creamSystem = new THREE.Points(geo, mat);
            scene.add(creamSystem);
        }

        function createOrnaments() {
            const candleGeo = new THREE.CylinderGeometry(0.22, 0.22, 1.6, 16);
            const candleMat = new THREE.MeshStandardMaterial({
                color: 0xffffff, metalness: 0.35, roughness: 0.25, emissive: 0x222222
            });
            const ballGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const ballMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gold, metalness: 0.95, roughness: 0.25, emissive: 0x221100
            });

            ornamentSystem = new THREE.InstancedMesh(ballGeo, ballMat, CONFIG.ornamentCount);
            ornamentSystem.userData = { scatterPos: [], cakePos: [], candlePos: [] };
            const dummy = new THREE.Object3D();
            const candlePositions = [
                new THREE.Vector3(-2.0, 6.8, -1.4),
                new THREE.Vector3(2.0, 6.8, -1.4),
                new THREE.Vector3(-1.0, 6.8, 2.4),
                new THREE.Vector3(1.0, 6.8, 2.4),
                new THREE.Vector3(0, 7.5, 0)
            ];

            for (let i = 0; i < CONFIG.ornamentCount; i++) {
                let targetPos;
                if (i < candlePositions.length) {
                    targetPos = candlePositions[i];
                    const candleMesh = new THREE.Mesh(candleGeo, candleMat);
                    candleMesh.position.copy(targetPos);
                    scene.add(candleMesh);
                    ornamentSystem.userData.candlePos.push(targetPos.clone());
                } else {
                    const topYMin = CONFIG.cake.bottom.height / 2;
                    const topYMax = topYMin + CONFIG.cake.top.height;
                    const ang = Math.random() * Math.PI * 2;
                    const d = Math.sqrt(Math.random()) * CONFIG.cake.top.radius * 0.82;
                    targetPos = new THREE.Vector3(Math.cos(ang) * d, topYMin + Math.random() * (topYMax - topYMin), Math.sin(ang) * d);
                }
                ornamentSystem.userData.cakePos.push(targetPos);
                const rS = CONFIG.scatterRadius * 1.15;
                const scatterV = new THREE.Vector3((Math.random() - 0.5) * rS * 2, (Math.random() - 0.5) * rS * 2, (Math.random() - 0.5) * rS * 2);
                ornamentSystem.userData.scatterPos.push(scatterV);
                dummy.position.copy(scatterV);
                dummy.scale.setScalar(Math.random() * 0.45 + 0.55);
                dummy.updateMatrix();
                ornamentSystem.setMatrixAt(i, dummy.matrix);
            }
            ornamentSystem.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(ornamentSystem);
        }

        function createFlameParticles() {
            const geo = new THREE.BufferGeometry();
            const origin = [], random = [], life = [];
            const candlePoints = ornamentSystem.userData.candlePos;
            for (let i = 0; i < CONFIG.flameCount; i++) {
                const p = candlePoints[Math.floor(Math.random() * candlePoints.length)];
                origin.push(p.x, p.y + 1.35, p.z);
                random.push(Math.random());
                life.push(Math.random() * 2.3 + 1.3);
            }
            geo.setAttribute('aOrigin', new THREE.Float32BufferAttribute(origin, 3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(random, 1));
            geo.setAttribute('aLife', new THREE.Float32BufferAttribute(life, 1));
            const flameMat = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 } },
                vertexShader: flameVertexShader,
                fragmentShader: flameFragmentShader,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            flameSystem = new THREE.Points(geo, flameMat);
            flameSystem.visible = false;
            scene.add(flameSystem);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            STATE.time += dt;

            if (STATE.stage === 0) {
                const target = 0;
                STATE.transition += (target - STATE.transition) * 0.022;
                flameSystem.visible = false;
            } else {
                const target = 1;
                STATE.transition += (target - STATE.transition) * 0.022;
                flameSystem.visible = STATE.stage === 2;
                if (flameSystem.visible) flameSystem.material.uniforms.uTime.value = STATE.time;
            }

            foliageSystem.material.uniforms.uTime.value = STATE.time;
            foliageSystem.material.uniforms.uTransition.value = STATE.transition;
            foliageSystem.rotation.y = STATE.time * 0.045;

            creamSystem.material.uniforms.uTime.value = STATE.time;
            creamSystem.material.uniforms.uTransition.value = STATE.transition;
            creamSystem.rotation.y = STATE.time * 0.045;

            ornamentSystem.rotation.y = STATE.time * 0.045;
            const dummy = new THREE.Object3D();
            for (let i = 0; i < CONFIG.ornamentCount; i++) {
                const s = ornamentSystem.userData.scatterPos[i];
                const e = ornamentSystem.userData.cakePos[i];
                let t = STATE.transition;
                t = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                dummy.position.set(s.x + (e.x - s.x) * t, s.y + (e.y - s.y) * t, s.z + (e.z - s.z) * t);
                dummy.position.y += Math.sin(STATE.time * 1.8 + i) * 0.08;
                dummy.scale.setScalar(1 + Math.sin(STATE.time * 2.8 + i) * 0.08);
                dummy.updateMatrix();
                ornamentSystem.setMatrixAt(i, dummy.matrix);
            }
            ornamentSystem.instanceMatrix.needsUpdate = true;

            const camR = 70;
            camera.position.x = Math.sin(STATE.time * 0.09) * camR;
            camera.position.z = Math.cos(STATE.time * 0.09) * camR;
            camera.lookAt(0, 3.5, 0);

            composer.render();
        }
        init();
    </script>
</body>
</html>
