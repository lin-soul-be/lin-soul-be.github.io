<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日蛋糕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #020202;
            font-family: SimSun, serif;
            color: #ffd4b8;
        }
        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        #ui-layer {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }
        h1 {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 4px;
            margin: 0 0 10px;
            text-shadow: 0 0 20px rgba(255, 210, 170, 0.3);
            opacity: 0.8;
        }
        .btn {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 210, 170, 0.3);
            color: #ffd4b8;
            padding: 12px 30px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            pointer-events: auto;
            transition: all .5s cubic-bezier(0.19,1,0.22,1);
            backdrop-filter: blur(10px);
        }
        .btn:hover {
            background: rgba(255, 210, 170, 0.1);
            border-color: #ffd4b8;
            box-shadow: 0 0 20px rgba(255, 210, 170, 0.15);
            transform: translateY(-2px);
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            letter-spacing: 5px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: .3; }
            50% { opacity: 1; }
        }
        #textCanvas {
            width: 600px;
            height: 220px;
            visibility: hidden;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="loading">加载中...</div>
    <canvas id="textCanvas"></canvas>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <h1>生日蛋糕</h1>
        <button id="toggle-btn" class="btn">点击一下</button>
    </div>
    <audio id="bgmAudio" src="bgm.mp3">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        
// 粘贴这段音频控制代码
const audio = document.getElementById('bgmAudio');
let played = false;

audio.onended = () => {
  audio.currentTime = 0;
};

document.getElementById('toggle-btn').addEventListener('click', () => {
  if (played) return;
  audio.play();
  played = true;
});

        const CONFIG = Object.freeze({
            particle: {
                foliage: 28000,
                cream: 6000,
                ornament: 420,
                flame: 1800,
                text: 5000
            },
            colors: {
                cream: new THREE.Color('#fff8ee'),
                creamShadow: new THREE.Color('#e6d5be'),
                pink: new THREE.Color('#ffb8c8'),
                pinkDark: new THREE.Color('#ff8fab'),
                gold: new THREE.Color('#FFD700'),
                chocolate: new THREE.Color('#6b3f28'),
                flame: new THREE.Color('#ff7722'),
                flameBright: new THREE.Color('#fff299'),
                text: new THREE.Color('#ffffff')
            },
            cake: {
                bottom: { radius: 10.5, height: 5.0 },
                top: { radius: 6.2, height: 3.8 },
                gap: 0.0
            },
            scatterRadius: 42,
            textHeight: 17,
            textDistance: 68,
            bloom: { threshold: 0.35, strength: 0.6, radius: 0.4 },
            camera: { fov: 45, distance: 70, rotateSpeed: 0.09 },
            animSpeed: { transLerp: 0.022, flameLerp: 0.018, textLerp: 0.028 }
        });

        const STATE = {
            stage: 0,
            transition: 0,
            flameGather: 0,
            textAnimT: 0,
            targetTextAnimT: 0,
            time: 0,
            audio:null,
            firstPlay:false
        };

        let scene, camera, renderer, composer;
        let foliageSystem, creamSystem, ornamentSystem, flameSystem, textPoints;
        const clock = new THREE.Clock();
        const textCanvas = document.getElementById('textCanvas');
        const textCtx = textCanvas.getContext('2d');

        const UTIL = {
            dummyObj: new THREE.Object3D(),
            tempVec3: new THREE.Vector3(),
            tempColor: new THREE.Color(),
            smoothCubic: t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
            randomSphere: r => {
                const u = Math.random(), v = Math.random();
                const theta = Math.PI * 2 * u;
                const phi = Math.acos(2 * v - 1);
                const sR = r * Math.cbrt(Math.random());
                return [
                    sR * Math.sin(phi) * Math.sin(theta),
                    sR * Math.sin(phi) * Math.cos(phi),
                    sR * Math.cos(phi)
                ]
            }
        };

        const SHADER = {
            textVertex: `
                uniform float uTime;
                uniform float uAnimT;
                attribute vec3 aScatterPos;
                attribute vec3 aNameTarget;
                attribute vec3 aBirthTarget;
                attribute float aRand;
                attribute float aSize;
                attribute vec3 aColor;
                varying vec3 vColor;
                varying float vOpacity;

                float smoothCubic(float t){
                    return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t+2.0,3.0)/2.0;
                }

                void main(){
                    vColor = aColor;

                    float t0 = smoothCubic(clamp(uAnimT, 0.0, 1.0));
                    float t1 = smoothCubic(clamp(uAnimT - 1.0, 0.0, 1.0));

                    vec3 pos = mix(aScatterPos, mix(aNameTarget, aBirthTarget, t1), t0);

                    pos += sin(uTime * 1.2 + aRand * 12.0) * 0.035 * vec3(1.0, 1.0, 0.3);

                    float alpha = smoothstep(0.0, 0.15, uAnimT) * (1.0 - smoothstep(1.85, 2.0, uAnimT));
                    vOpacity = alpha;

                    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mv;
                    gl_PointSize = aSize * (300.0 / -mv.z);
                }
            `,
            textFrag: `
                varying vec3 vColor;
                varying float vOpacity;
                void main(){
                    vec2 uv = gl_PointCoord - 0.5;
                    float d = length(uv);
                    if(d > 0.5) discard;
                    gl_FragColor = vec4(vColor, pow(1.0 - d*2.0, 1.5) * vOpacity);
                }
            `,
            foliageVertex: `
                uniform float uTime;
                uniform float uTransition;
                attribute vec3 aScatterPos;
                attribute vec3 aCakePos;
                attribute float aRandom;
                attribute float aSize;
                attribute vec3 aColor;
                varying vec3 vColor;

                float cubicInOut(float t) {
                    return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t+2.0,3.0)/2.0;
                }

                void main() {
                    vColor = aColor;
                    float t = cubicInOut(clamp((uTransition * 1.45) - aRandom*0.55, 0.0, 1.0));
                    vec3 pos = mix(aScatterPos, aCakePos, t);
                    pos += normalize(pos + 0.001) * sin(uTime*1.6 + aRandom*12.0)*0.08;
                    pos.y += sin(uTime*0.9 + aRandom*80.0)*0.035;
                    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mv;
                    gl_PointSize = aSize * (420.0 / -mv.z);
                }
            `,
            foliageFrag: `
                varying vec3 vColor;
                void main(){
                    vec2 uv = gl_PointCoord - 0.5;
                    float d = length(uv);
                    if(d > 0.5) discard;
                    gl_FragColor = vec4(vColor, pow(1.0 - d*2.0, 1.6) * 0.85);
                }
            `,
            flameVertex: `
                uniform float uTime;
                uniform float uFlameGather;
                attribute vec3 aScatterPos;
                attribute vec3 aCandlePos;
                attribute float aRandom;
                attribute float aSize;
                attribute vec3 aColor;
                varying vec3 vColor;
                varying float vAlpha;

                float cubicInOut(float t) {
                    return t < 0.5 ? 4.0*t*t*t : 1.0 - pow(-2.0*t+2.0,3.0)/2.0;
                }

                void main() {
                    vColor = aColor;
                    vec3 pos = mix(aScatterPos, aCandlePos, cubicInOut(clamp(uFlameGather,0.,1.)));
                    float idle = sin(uTime*2.5 + aRandom*14.) * 0.06;
                    pos.xz += vec2(idle, idle*0.5);
                    pos.y += abs(idle)*0.35;
                    vAlpha = 0.85;
                    vec4 mv = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mv;
                    gl_PointSize = aSize * (320.0 / -mv.z);
                }
            `,
            flameFrag: `
                varying vec3 vColor;
                varying float vAlpha;
                void main(){
                    vec2 uv = gl_PointCoord - 0.5;
                    float d = length(uv);
                    if(d > 0.5) discard;
                    gl_FragColor = vec4(vColor, pow(1.0 - d*2.0, 1.2) * vAlpha);
                }
            `
        };

        // 文字点阵生成
        function getTextPoints(text, yOffset = 0) {
            textCtx.clearRect(0,0,textCanvas.width,textCanvas.height);
            textCtx.fillStyle = '#fff';
            textCtx.font = 'bold 92px SimSun';
            textCtx.textAlign = 'center';
            textCtx.fillText(text, textCanvas.width/2, 110 + yOffset);
            const img = textCtx.getImageData(0,0,textCanvas.width,textCanvas.height);
            const list = [];
            const step = 4;
            const scale = 0.06;
            const baseY = CONFIG.textHeight;
            for(let y=0; y<textCanvas.height; y+=step){
                for(let x=0; x<textCanvas.width; x+=step){
                    const idx = (y * textCanvas.width + x) * 4;
                    if(img.data[idx] > 70){
                        list.push(new THREE.Vector3(
                            (x - textCanvas.width/2) * scale,
                            baseY - y * scale,
                            -6
                        ));
                    }
                }
            }
            return list;
        }

        // 创建文字粒子
        function createTextMesh() {
            const namePoints = getTextPoints("王雅丽", -35);
            const birthPoints = getTextPoints("生日快乐", 40);
            const geo = new THREE.BufferGeometry();
            const scatter = [], t1 = [], t2 = [], rand = [], size = [], color = [];
            const total = CONFIG.particle.text;
            for(let i=0; i<total; i++){
                const [sx,sy,sz] = UTIL.randomSphere(CONFIG.scatterRadius * 1.3);
                scatter.push(sx,sy,sz);
                const p1 = namePoints[i % namePoints.length];
                t1.push(p1.x, p1.y, p1.z);
                const p2 = birthPoints[i % birthPoints.length];
                t2.push(p2.x, p2.y, p2.z);
                rand.push(Math.random());
                size.push(Math.random() * 0.3 + 0.2);
                color.push(CONFIG.colors.text.r, CONFIG.colors.text.g, CONFIG.colors.text.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatter,3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatter,3));
            geo.setAttribute('aNameTarget', new THREE.Float32BufferAttribute(t1,3));
            geo.setAttribute('aBirthTarget', new THREE.Float32BufferAttribute(t2,3));
            geo.setAttribute('aRand', new THREE.Float32BufferAttribute(rand,1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(size,1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(color,3));
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value:0}, uAnimT: {value:0} },
                vertexShader: SHADER.textVertex,
                fragmentShader: SHADER.textFrag,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            textPoints = new THREE.Points(geo, mat);
            scene.add(textPoints);
        }

        // 底层蛋糕粒子
        function createFoliageParticles() {
            const geo = new THREE.BufferGeometry();
            const scatterPos = [], cakePos = [], randoms = [], sizes = [], colors = [];
            const cake = CONFIG.cake;
            const btmYMin = -cake.bottom.height / 2;
            const btmYMax = cake.bottom.height / 2;
            const topYMin = btmYMax + cake.gap;
            const topYMax = topYMin + cake.top.height;
            const total = CONFIG.particle.foliage;
            for(let i=0; i<total; i++){
                const layer = Math.random() < 0.55;
                const r = layer ? cake.bottom.radius : cake.top.radius;
                const yMin = layer ? btmYMin : topYMin;
                const yMax = layer ? btmYMax : topYMax;
                const [sx,sy,sz] = UTIL.randomSphere(CONFIG.scatterRadius);
                scatterPos.push(sx,sy,sz);
                const ang = Math.PI * 2 * Math.random();
                const cR = Math.sqrt(Math.random()) * r;
                const cy = yMin + Math.random() * (yMax - yMin);
                cakePos.push(Math.cos(ang)*cR, cy, Math.sin(ang)*cR);
                randoms.push(Math.random());
                const s = Math.random() * 0.38 + 0.26;
                sizes.push(s);
                if(Math.random() > 0.972){
                    UTIL.tempColor.copy(CONFIG.colors.gold);
                    sizes[sizes.length-1] *= 2.1;
                }else{
                    UTIL.tempColor.lerpColors(layer ? CONFIG.colors.chocolate : CONFIG.colors.pink, CONFIG.colors.cream, Math.random());
                }
                colors.push(UTIL.tempColor.r, UTIL.tempColor.g, UTIL.tempColor.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aCakePos', new THREE.Float32BufferAttribute(cakePos,3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms,1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes,1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors,3));
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value:0}, uTransition: {value:0} },
                vertexShader: SHADER.foliageVertex,
                fragmentShader: SHADER.foliageFrag,
                transparent: true, depthWrite: false
            });
            foliageSystem = new THREE.Points(geo, mat);
            scene.add(foliageSystem);
        }

        // 顶层奶油粒子
        function createCreamParticles() {
            const geo = new THREE.BufferGeometry();
            const scatterPos = [], cakePos = [], randoms = [], sizes = [], colors = [];
            const cake = CONFIG.cake;
            const topYMin = cake.bottom.height / 2 + cake.gap;
            const topCY = topYMin + cake.top.height * 0.5;
            const total = CONFIG.particle.cream;
            for(let i=0; i<total; i++){
                const [sx,sy,sz] = UTIL.randomSphere(CONFIG.scatterRadius);
                scatterPos.push(sx,sy,sz);
                const ang = Math.PI * 2 * Math.random();
                const dist = Math.sqrt(Math.random()) * cake.top.radius * 0.88;
                const noise = (Math.random() - 0.5) * 0.18;
                cakePos.push(Math.cos(ang)*dist, topCY + noise, Math.sin(ang)*dist);
                randoms.push(Math.random());
                sizes.push(Math.random() * 0.34 + 0.30);
                UTIL.tempColor.lerpColors(CONFIG.colors.cream, CONFIG.colors.creamShadow, Math.random());
                colors.push(UTIL.tempColor.r, UTIL.tempColor.g, UTIL.tempColor.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aCakePos', new THREE.Float32BufferAttribute(cakePos,3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms,1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes,1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors,3));
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value:0}, uTransition: {value:0} },
                vertexShader: SHADER.foliageVertex,
                fragmentShader: SHADER.foliageFrag,
                transparent: true, depthWrite: false
            });
            creamSystem = new THREE.Points(geo, mat);
            scene.add(creamSystem);
        }

        // 装饰金球+蜡烛
        function createOrnaments() {
            const candleGeo = new THREE.CylinderGeometry(0.22, 0.22, 1.6, 16);
            const candleMat = new THREE.MeshStandardMaterial({
                color: 0xffffff, metalness: 0.35, roughness: 0.25, emissive: 0x222222
            });
            const ballGeo = new THREE.SphereGeometry(0.35, 16, 16);
            const ballMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gold, metalness: 0.95, roughness: 0.25, emissive: 0x221100
            });
            ornamentSystem = new THREE.InstancedMesh(ballGeo, ballMat, CONFIG.particle.ornament);
            ornamentSystem.userData = { scatter: [], cake: [], candle: [] };
            const candlePosList = [
                new THREE.Vector3(-2.0, 6.8, -1.4),
                new THREE.Vector3(2.0, 6.8, -1.4),
                new THREE.Vector3(-1.0, 6.8, 2.4),
                new THREE.Vector3(1.0, 6.8, 2.4),
                new THREE.Vector3(0, 7.5, 0)
            ];
            const cake = CONFIG.cake;
            const topYMin = cake.bottom.height / 2;
            const topYMax = topYMin + cake.top.height;
            const dummy = UTIL.dummyObj;
            for(let i=0; i<CONFIG.particle.ornament; i++){
                let target;
                if(i < candlePosList.length){
                    target = candlePosList[i];
                    const candle = new THREE.Mesh(candleGeo, candleMat);
                    candle.position.copy(target);
                    scene.add(candle);
                    ornamentSystem.userData.candle.push(target.clone());
                }else{
                    const ang = Math.PI * 2 * Math.random();
                    const d = Math.sqrt(Math.random()) * cake.top.radius * 0.82;
                    target = new THREE.Vector3(
                        Math.cos(ang)*d,
                        topYMin + Math.random() * (topYMax - topYMin),
                        Math.sin(ang)*d
                    );
                }
                ornamentSystem.userData.cake.push(target);
                const [sx,sy,sz] = UTIL.randomSphere(CONFIG.scatterRadius * 1.15);
                ornamentSystem.userData.scatter.push(new THREE.Vector3(sx,sy,sz));
                dummy.position.set(sx,sy,sz);
                dummy.scale.setScalar(Math.random() * 0.45 + 0.55);
                dummy.updateMatrix();
                ornamentSystem.setMatrixAt(i, dummy.matrix);
            }
            ornamentSystem.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(ornamentSystem);
        }

        // 火焰粒子
        function createFlameParticles() {
            const geo = new THREE.BufferGeometry();
            const scatterPos = [], candlePos = [], randoms = [], sizes = [], colors = [];
            const candlePoints = ornamentSystem.userData.candle;
            const total = CONFIG.particle.flame;
            for(let i=0; i<total; i++){
                const candle = candlePoints[Math.floor(Math.random() * candlePoints.length)];
                const [sx,sy,sz] = UTIL.randomSphere(CONFIG.scatterRadius * 1.15);
                scatterPos.push(sx,sy,sz);
                const spread = 0.35;
                const ang = Math.PI * 2 * Math.random();
                const r = Math.random() * spread;
                candlePos.push(
                    candle.x + Math.cos(ang)*r,
                    candle.y + 1.8 + Math.random()*0.45,
                    candle.z + Math.sin(ang)*r
                );
                randoms.push(Math.random());
                sizes.push(Math.random() * 0.45 + 0.25);
                UTIL.tempColor.copy(Math.random() < 0.35 ? CONFIG.colors.flame : CONFIG.colors.flameBright);
                colors.push(UTIL.tempColor.r, UTIL.tempColor.g, UTIL.tempColor.b);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aScatterPos', new THREE.Float32BufferAttribute(scatterPos,3));
            geo.setAttribute('aCandlePos', new THREE.Float32BufferAttribute(candlePos,3));
            geo.setAttribute('aRandom', new THREE.Float32BufferAttribute(randoms,1));
            geo.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes,1));
            geo.setAttribute('aColor', new THREE.Float32BufferAttribute(colors,3));
            const mat = new THREE.ShaderMaterial({
                uniforms: { uTime: {value:0}, uFlameGather: {value:0} },
                vertexShader: SHADER.flameVertex,
                fragmentShader: SHADER.flameFrag,
                transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
            });
            flameSystem = new THREE.Points(geo, mat);
            flameSystem.visible = false;
            scene.add(flameSystem);
        }

        // 窗口自适应
        function resizeHandler() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        }

        // 主渲染循环
        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            STATE.time += dt;
            const t = STATE.time;

            const foliageMat = foliageSystem.material;
            foliageMat.uniforms.uTime.value = t;
            foliageMat.uniforms.uTransition.value = STATE.transition;
            foliageSystem.rotation.y = t * CONFIG.camera.rotateSpeed;

            const creamMat = creamSystem.material;
            creamMat.uniforms.uTime.value = t;
            creamMat.uniforms.uTransition.value = STATE.transition;
            creamSystem.rotation.y = t * CONFIG.camera.rotateSpeed;

            ornamentSystem.rotation.y = t * CONFIG.camera.rotateSpeed;

            // 更新装饰小球动画
            const dummy = UTIL.dummyObj;
            const transT = UTIL.smoothCubic(STATE.transition);
            const ornamentData = ornamentSystem.userData;
            for(let i=0; i<CONFIG.particle.ornament; i++){
                const s = ornamentData.scatter[i];
                const e = ornamentData.cake[i];
                dummy.position.lerpVectors(s, e, transT);
                dummy.position.y += Math.sin(t * 1.8 + i) * 0.08;
                dummy.scale.setScalar(1 + Math.sin(t * 2.8 + i) * 0.08);
                dummy.updateMatrix();
                ornamentSystem.setMatrixAt(i, dummy.matrix);
            }
            ornamentSystem.instanceMatrix.needsUpdate = true;

            textPoints.material.uniforms.uTime.value = t;
            textPoints.material.uniforms.uAnimT.value = STATE.textAnimT;
            textPoints.lookAt(camera.position);

            // 阶段切换插值
            const speed = CONFIG.animSpeed;
            switch(STATE.stage){
                case 0:
                    STATE.transition += (0 - STATE.transition) * speed.transLerp;
                    STATE.flameGather += (0 - STATE.flameGather) * speed.transLerp;
                    flameSystem.visible = false;
                    break;
                case 1:
                    STATE.transition += (1 - STATE.transition) * speed.transLerp;
                    STATE.flameGather += (0 - STATE.flameGather) * speed.transLerp;
                    flameSystem.visible = false;
                    break;
                case 2:
                    STATE.transition += (1 - STATE.transition) * speed.transLerp;
                    STATE.flameGather += (1 - STATE.flameGather) * speed.flameLerp;
                    flameSystem.visible = true;
                    flameSystem.material.uniforms.uTime.value = t;
                    flameSystem.material.uniforms.uFlameGather.value = STATE.flameGather;
                    break;
            }
            STATE.textAnimT += (STATE.targetTextAnimT - STATE.textAnimT) * speed.textLerp;

            // 相机环绕
            const camDist = CONFIG.camera.distance;
            camera.position.set(
                Math.sin(t * CONFIG.camera.rotateSpeed) * camDist,
                8,
                Math.cos(t * CONFIG.camera.rotateSpeed) * camDist
            );
            camera.lookAt(0, 3.5, 0);

            composer.render();
        }

        // 初始化
        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020202, 0.018);
            camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 8, CONFIG.camera.distance);
            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.6;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 灯光
            const ambient = new THREE.AmbientLight(0xffffff, 0.28);
            scene.add(ambient);
            const spot1 = new THREE.SpotLight(0xffddbb, 110);
            spot1.position.set(22,48,22);
            spot1.angle = 0.5; spot1.penumbra = 1;
            scene.add(spot1);
            scene.add(new THREE.SpotLight(0xffffff, 45, 0, 0, 0, 0).position.set(-18,8,18));
            scene.add(new THREE.PointLight(0xffccaa, 18, 100).position.set(0,18,-18));

            // 后期泛光
            const renderPass = new RenderPass(scene, camera);
            const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), CONFIG.bloom.strength, CONFIG.bloom.radius, CONFIG.bloom.threshold);
            composer = new EffectComposer(renderer);
            composer.addPass(renderPass);
            composer.addPass(bloom);

            // 创建粒子系统
            createFoliageParticles();
            createCreamParticles();
            createOrnaments();
            createFlameParticles();
            createTextMesh();

            // 隐藏加载文字
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', resizeHandler, { passive: true });

            // 按钮切换阶段
            document.getElementById('toggle-btn').addEventListener('click', async () => {
    // 只第一次点击播放背景音乐
    if (!STATE.firstPlay) {
        try {
            STATE.audio = new Audio("bgm.mp3");
            STATE.audio.volume = 0.35;
            STATE.audio.loop = true;
            await STATE.audio.play();
            STATE.firstPlay = true;
        } catch (err) {
            console.log("音乐加载失败：", err);
        }
    }

    // 原有蛋糕切换逻辑保留
    STATE.stage = (STATE.stage + 1) % 3;
    const btn = document.getElementById('toggle-btn');
    if(STATE.stage === 0){
        btn.textContent = '点击一下';
        STATE.targetTextAnimT = 0;
    }else if(STATE.stage === 1){
        btn.textContent = '生日快乐';
        STATE.targetTextAnimT = 1;
    }else{
        btn.textContent = '心想事成';
        STATE.targetTextAnimT = 2;
    }
});

                    STATE.targetTextAnimT = 1;
                }else{

                    STATE.targetTextAnimT = 2;

            animate();
